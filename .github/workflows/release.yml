# On a published GitHub release: write the tag (without the "v") into the
# manifest's version, zip the integration and attach the zip to the release.
# HACS installs that zip (hacs.json: zip_release), so manifest.json on main
# keeps the placeholder version 0.0.0.
#
# Run it by hand (Actions -> Release -> Run workflow) with a tag to attach the
# zip to an existing release, e.g. one made before this workflow existed.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the zip for, e.g. v0.2.0
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set the manifest version from the tag
        working-directory: custom_components/web_reader
        run: |
          jq --arg version "${TAG#v}" '.version = $version' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          jq -r .version manifest.json

      - name: Zip the integration
        working-directory: custom_components/web_reader
        run: zip -r "$GITHUB_WORKSPACE/web_reader.zip" . -x '*__pycache__*'

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" web_reader.zip --clobber
